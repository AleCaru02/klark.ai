name: Deploy Supabase Candidate Runtime

on:
  push:
    branches:
      - migration/supabase-candidate
    paths:
      - '.github/workflows/deploy-supabase-candidate.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ipazbzctivqquwndifxh
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify candidate only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$PROJECT_REF" = "ipazbzctivqquwndifxh"
          supabase functions list --project-ref "$PROJECT_REF" >/dev/null
      - name: Configure internal-only candidate secrets
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/candidate.env"
          trap 'rm -f "$f"' EXIT
          umask 077
          {
            printf 'CHATBOT_SESSION_SECRET=%s\n' "$(openssl rand -hex 48)"
            printf 'CHATBOT_IP_HASH_SALT=%s\n' "$(openssl rand -hex 48)"
            printf 'APP_URL=%s\n' 'https://clerkai-preview-alecaru02.vercel.app'
            printf 'ALLOWED_ORIGINS=%s\n' 'https://www.clerkai.it'
          } > "$f"
          supabase secrets set --project-ref "$PROJECT_REF" --env-file "$f" >/dev/null
          rm -f "$f"
          trap - EXIT
      - name: Deploy Fase 1 Voice runtime (inert until tenant activation)
        shell: bash
        run: |
          set -euo pipefail
          for fn in twilio-make-call twilio-voice-webhook twilio-voice-gather twilio-call-status process-call-queue; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
      - name: Deploy public chatbot runtime
        shell: bash
        run: |
          set -euo pipefail
          for fn in site-chat-bootstrap site-chat-message; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
      - name: Deploy Google Calendar runtime
        shell: bash
        run: |
          set -euo pipefail
          for fn in google-auth-start google-auth-callback ai-book-appointment google-calendar-sync calendar-watch; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
      - name: Remove temporary migration receiver
        shell: bash
        run: |
          set -euo pipefail
          supabase functions delete migration-receiver-temp --project-ref "$PROJECT_REF" --yes || true
      - name: Audit deployed functions
        run: supabase functions list --project-ref "$PROJECT_REF"
