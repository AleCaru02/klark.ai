name: Deploy ClerkAI Candidate Preview Temp

on:
  push:
    branches:
      - agent/mvp-production-readiness-20260810

permissions:
  contents: read

concurrency:
  group: clerkai-candidate-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_M6fYd90idkyQEw1ba5tc8WwS
      VERCEL_PROJECT_ID: prj_vOrjz5xpVJKZ9SLLLxduGnsVuyNR
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require preview deployment credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN"; exit 1; }

      - name: Install dependencies and Vercel CLI
        run: |
          npm ci --no-audit --no-fund
          npm install --global vercel@latest

      - name: Pull preview configuration
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build preview artifact
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview only
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt \
            --meta githubCommitSha="$GITHUB_SHA" \
            --meta githubCommitRef="$GITHUB_REF_NAME" \
            --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"

      - name: Verify deployment ready
        run: vercel inspect "${{ steps.deploy.outputs.url }}" --wait --token="$VERCEL_TOKEN"
