name: Test Candidate Chatbot Runtime

on:
  push:
    branches:
      - migration/supabase-candidate
    paths:
      - '.github/workflows/test-candidate-chatbot.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://ipazbzctivqquwndifxh.supabase.co/functions/v1
      WIDGET_KEY: 21332d02-8c76-458b-9961-267db3044205
      ORIGIN: https://clerkai-preview-alecaru02.vercel.app
    steps:
      - name: Bootstrap and message without exposing session credentials
        shell: bash
        run: |
          set -euo pipefail
          b="$RUNNER_TEMP/bootstrap.json"
          m="$RUNNER_TEMP/message.json"
          trap 'rm -f "$b" "$m"' EXIT
          bcode=$(curl -sS -o "$b" -w '%{http_code}' -X POST \
            -H "Origin: $ORIGIN" \
            "$BASE_URL/site-chat-bootstrap?key=$WIDGET_KEY")
          test "$bcode" = "201"
          sid=$(jq -r '.session_id // empty' "$b")
          stok=$(jq -r '.session_token // empty' "$b")
          test -n "$sid" && test -n "$stok"
          payload=$(jq -cn --arg sid "$sid" --arg tok "$stok" '{session_id:$sid,session_token:$tok,message:"Cosa fa ClerkAI?",consent:true,action:"message"}')
          mcode=$(curl -sS -o "$m" -w '%{http_code}' -X POST \
            -H "Origin: $ORIGIN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$BASE_URL/site-chat-message?key=$WIDGET_KEY")
          test "$mcode" = "200"
          test -n "$(jq -r '.answer // empty' "$m")"
          pstatus=$(jq -r '.provider_status // empty' "$m")
          test -n "$pstatus"
          echo "BOOTSTRAP_HTTP=$bcode"
          echo "MESSAGE_HTTP=$mcode"
          echo "PROVIDER_STATUS=$pstatus"
