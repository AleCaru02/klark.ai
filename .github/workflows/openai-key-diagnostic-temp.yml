name: OpenAI Key Diagnostic

on:
  push:
    branches:
      - diagnostic/openai-chatbot-e2e20
    paths:
      - '.github/workflows/openai-key-diagnostic-temp.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Inspect granted model IDs safely
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY=MISSING"; exit 1; }
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          key = os.environ['OPENAI_API_KEY']
          req = urllib.request.Request(
              'https://api.openai.com/v1/models',
              headers={'Authorization': f'Bearer {key}'},
              method='GET',
          )
          try:
              with urllib.request.urlopen(req, timeout=45) as resp:
                  data = json.loads(resp.read().decode('utf-8'))
                  print(f"MODELS_HTTP={resp.status}")
          except urllib.error.HTTPError as exc:
              raw = exc.read().decode('utf-8', errors='replace')
              try: data = json.loads(raw)
              except Exception: data = {'error': {'message': raw[:500]}}
              e = data.get('error') or {}
              print(f"MODELS_HTTP={exc.code}")
              print(f"MODELS_ERROR_CODE={e.get('code')}")
              print(f"MODELS_ERROR_MESSAGE={str(e.get('message') or '')[:500]}")
              raise SystemExit(1)

          ids = sorted({m.get('id') for m in data.get('data', []) if m.get('id')})
          relevant = [m for m in ids if m.startswith(('gpt-', 'o1', 'o3', 'o4'))]
          print(f"MODEL_COUNT={len(ids)}")
          print(f"CHAT_LIKE_MODEL_COUNT={len(relevant)}")
          for model in relevant[:100]:
              print(f"GRANTED_MODEL={model}")
          PY
