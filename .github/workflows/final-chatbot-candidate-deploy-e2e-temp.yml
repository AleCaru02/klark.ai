name: Final Candidate Chatbot Deploy E2E20

on:
  push:
    branches:
      - fix/chatbot-openai-e2e20
    paths:
      - '.github/workflows/final-chatbot-candidate-deploy-e2e-temp.yml'

permissions:
  contents: read

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PROJECT_REF: ipazbzctivqquwndifxh
      CHAT_BASE: https://ipazbzctivqquwndifxh.supabase.co/functions/v1
      WIDGET_KEY: 21332d02-8c76-458b-9961-267db3044205
      CHAT_ORIGIN: https://clerkai-preview-alecaru02.vercel.app
      TEST_UA: ClarkAI-E2E20-FINAL-20260809
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify fixed candidate and required secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = "ipazbzctivqquwndifxh"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$OPENAI_API_KEY"
          echo "SECRETS_PRESENT=true"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply versioned migrations to candidate only
        shell: bash
        run: |
          set -euo pipefail
          printf '\n' | supabase link --project-ref "$PROJECT_REF"
          supabase db push --dry-run --linked --include-all
          supabase db push --linked --include-all --yes
          echo "CANDIDATE_MIGRATIONS_APPLIED=true"

      - name: Pin verified OpenAI runtime server-side
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/openai-runtime.env"
          trap 'rm -f "$f"' EXIT
          umask 077
          {
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'OPENAI_CHAT_MODEL=gpt-5.4-mini\n'
          } > "$f"
          supabase secrets set --project-ref "$PROJECT_REF" --env-file "$f" >/dev/null
          rm -f "$f"
          trap - EXIT
          echo "OPENAI_RUNTIME_CONFIGURED=true"

      - name: Deploy chatbot Edge Functions from exact main with retry
        shell: bash
        run: |
          set -euo pipefail
          for fn in site-chat-bootstrap site-chat-message; do
            ok=0
            for attempt in 1 2 3; do
              echo "Deploy $fn attempt $attempt"
              if supabase functions deploy "$fn" --project-ref "$PROJECT_REF"; then
                ok=1
                break
              fi
              sleep $((attempt * 5))
            done
            test "$ok" = "1" || { echo "DEPLOY_FAILED=$fn"; exit 1; }
          done
          echo "CHATBOT_DEPLOYED=true"

      - name: Run final 20 real chatbot requests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error

          base=os.environ['CHAT_BASE']; key=os.environ['WIDGET_KEY']; origin=os.environ['CHAT_ORIGIN']; ua=os.environ['TEST_UA']
          questions=[
            "Cosa fa ClerkAI?",
            "Quanto costa?",
            "Posso usare il mio numero?",
            "Ho un cellulare 3331234567, devo cambiarlo?",
            "Ho già un numero 02, posso mantenerlo?",
            "Posso fare chiamate mentre ClerkAI chiama?",
            "Come funziona la deviazione se non rispondo?",
            "Funziona se sono occupato?",
            "Può gestire le chiamate fuori orario?",
            "Uso WhatsApp Business, posso continuare a usare l'app?",
            "Cos'è Coexistence?",
            "Può scrivere automaticamente a tutti i miei contatti?",
            "Faccio Facebook Ads: può chiamare i lead?",
            "Può chiamare lead che non hanno chiesto di essere ricontattati?",
            "Sono parrucchiere, cosa può fare ClerkAI per me?",
            "Sono un property manager, cosa può fare ClerkAI per me?",
            "Può prenotare appuntamenti su Google Calendar?",
            "Registra le chiamate?",
            "Come gestite privacy, consenso e opt-out?",
            "Se il cliente vuole parlare con una persona, come funziona il passaggio a un umano?",
          ]

          def post(url,payload):
            req=urllib.request.Request(url,data=json.dumps(payload).encode(),method='POST',headers={'Content-Type':'application/json','Origin':origin,'User-Agent':ua})
            try:
              with urllib.request.urlopen(req,timeout=90) as r: return r.status,json.loads(r.read().decode())
            except urllib.error.HTTPError as e:
              raw=e.read().decode(errors='replace')
              try: data=json.loads(raw)
              except Exception: data={'raw':raw[:500]}
              return e.code,data

          sessions=[]
          for i in range(4):
            status,data=post(f"{base}/site-chat-bootstrap?key={key}",{})
            if status!=201 or not data.get('session_id') or not data.get('session_token'):
              print(f"BOOTSTRAP_{i+1}=FAIL HTTP={status}"); sys.exit(1)
            sessions.append((data['session_id'],data['session_token']))
            print(f"BOOTSTRAP_{i+1}=PASS")

          failures=[]
          for i,q in enumerate(questions,1):
            sid,tok=sessions[(i-1)//5]
            status,data=post(f"{base}/site-chat-message?key={key}",{'session_id':sid,'session_token':tok,'message':q,'consent':True,'action':'message'})
            answer=str(data.get('answer') or '')
            provider=data.get('provider_status'); sources=data.get('sources') or []
            fallback=('in questo momento il servizio ai non è disponibile' in answer.lower() or 'chat service temporarily unavailable' in answer.lower())
            ok=status==200 and provider=='ok' and len(answer.strip())>=20 and len(sources)>0 and not fallback
            print(f"Q{i:02d}={'PASS' if ok else 'FAIL'} HTTP={status} PROVIDER={provider} SOURCES={len(sources)} ANSWER_LEN={len(answer)}")
            if not ok: failures.append(i)
            time.sleep(.75)
          print('E2E_REQUESTS=20')
          print(f"E2E_PASS={20-len(failures)}")
          print(f"E2E_FAIL={len(failures)}")
          if failures: sys.exit(1)
          print('FINAL_CHATBOT_E2E20_HTTP_PROVIDER=PASS')
          PY
