name: Temporary Publish Candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-publish-candidate.yml'

permissions:
  contents: read

concurrency:
  group: temporary-publish-candidate
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_M6fYd90idkyQEw1ba5tc8WwS
      VERCEL_PROJECT_ID: prj_vOrjz5xpVJKZ9SLLLxduGnsVuyNR
      VITE_SUPABASE_URL: https://ipazbzctivqquwndifxh.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_WVqZ-6gb2SutSOpqqFY_6w_YPUwmOp5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify candidate target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN"; exit 1; }
          test "$VERCEL_PROJECT_ID" = "prj_vOrjz5xpVJKZ9SLLLxduGnsVuyNR"
          test "$VITE_SUPABASE_URL" = "https://ipazbzctivqquwndifxh.supabase.co"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Vercel CLI
        run: |
          npm ci --no-audit --no-fund
          npm install --global vercel@latest

      - name: Pull candidate project configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Verify Supabase Auth settings
        shell: bash
        run: |
          set -euo pipefail
          settings="$(curl -fsSL -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" "$VITE_SUPABASE_URL/auth/v1/settings")"
          echo "$settings" | jq -e '.disable_signup == false' >/dev/null
          echo "Supabase Auth signup enabled"

      - name: Build candidate with candidate Supabase
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy candidate
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Candidate deployed"

      - name: Disable Vercel SSO protection for candidate
        shell: bash
        run: |
          set -euo pipefail
          vercel project protection disable clerkai-preview-alecaru02 --sso --token="$VERCEL_TOKEN"

      - name: Verify public candidate and backend wiring
        shell: bash
        run: |
          set -euo pipefail
          base="https://clerkai-preview-alecaru02.vercel.app"
          status="$(curl -sS -o /tmp/login.html -w '%{http_code}' "$base/login")"
          test "$status" = "200" || { echo "Public login returned HTTP $status"; exit 1; }
          asset="$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/login.html | head -1)"
          test -n "$asset" || { echo "Unable to locate JS asset"; exit 1; }
          curl -fsSL "$base$asset" -o /tmp/app.js
          grep -Fq 'ipazbzctivqquwndifxh.supabase.co' /tmp/app.js || { echo "Candidate Supabase URL missing from built bundle"; exit 1; }
          echo "Public login HTTP 200"
          echo "Candidate Supabase wiring verified"
