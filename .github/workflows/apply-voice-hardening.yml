name: Apply Voice Hardening Patch

on:
  push:
    branches:
      - mvp/voice-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp/voice-hardening
          fetch-depth: 0
      - name: Reconstruct and apply patch
        run: |
          set -euo pipefail
          cat .recovery/voice.patch.00 .recovery/voice.patch.01 | base64 -d | gzip -d > /tmp/voice.patch
          git apply -p1 --check /tmp/voice.patch
          git apply -p1 /tmp/voice.patch
          rm -rf .recovery
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden tenant Voice runtime and Twilio subaccounts'
          git push origin HEAD:mvp/voice-hardening
