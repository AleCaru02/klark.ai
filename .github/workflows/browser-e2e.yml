name: ClerkAI Browser E2E

on:
  push:
    branches:
      - agent/mvp-production-readiness-20260810
    paths:
      - '.github/workflows/browser-e2e.yml'
      - 'e2e/**'
      - 'playwright.config.mjs'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: clerkai-browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protected-preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright runner without changing lockfile
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium

      - name: Wait for exact protected preview and bootstrap E2E session
        uses: actions/github-script@v7
        env:
          BOOTSTRAP_URL: https://ipazbzctivqquwndifxh.supabase.co/functions/v1/e2e-ci-bootstrap
        with:
          script: |
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            for (let attempt = 1; attempt <= 40; attempt += 1) {
              const githubOidc = await core.getIDToken('clerkai-browser-e2e');
              core.setSecret(githubOidc);
              const response = await fetch(process.env.BOOTSTRAP_URL, {
                method: 'POST',
                headers: {
                  'content-type': 'application/json',
                  'x-github-oidc-token': githubOidc,
                },
                body: JSON.stringify({ runnerSha: process.env.GITHUB_SHA }),
              });
              const payload = await response.json().catch(() => ({}));
              if (response.status === 409 && payload.error === 'preview_sha_not_ready') {
                core.info(`Exact preview not ready yet (attempt ${attempt}/40).`);
                await sleep(30_000);
                continue;
              }
              if (!response.ok) {
                throw new Error(`E2E bootstrap failed with HTTP ${response.status}: ${payload.error || 'unknown_error'}`);
              }
              if (payload.runnerSha !== process.env.GITHUB_SHA) throw new Error('Bootstrap SHA mismatch');
              for (const value of [payload.baseUrl, payload.vercelOidcToken, payload.email, payload.password]) {
                if (!value) throw new Error('Bootstrap returned incomplete runtime data');
                core.setSecret(String(value));
              }
              core.exportVariable('E2E_BASE_URL', payload.baseUrl);
              core.exportVariable('E2E_VERCEL_OIDC_TOKEN', payload.vercelOidcToken);
              core.exportVariable('E2E_EMAIL', payload.email);
              core.exportVariable('E2E_PASSWORD', payload.password);
              core.info('Exact protected preview accepted; short-lived Vercel Trusted Source token and E2E credentials exported without logging values.');
              return;
            }
            throw new Error('Exact preview did not become available before timeout');

      - name: Run real Chromium browser smoke
        run: npx playwright test

      - name: Clear exported E2E values
        if: always()
        shell: bash
        run: |
          echo 'E2E_BASE_URL=' >> "$GITHUB_ENV"
          echo 'E2E_VERCEL_OIDC_TOKEN=' >> "$GITHUB_ENV"
          echo 'E2E_EMAIL=' >> "$GITHUB_ENV"
          echo 'E2E_PASSWORD=' >> "$GITHUB_ENV"

      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clerkai-browser-e2e-${{ github.sha }}
          path: |
            playwright-report/results.json
            e2e-artifacts/*.json
            e2e-artifacts/*-failure.png
          if-no-files-found: warn
          retention-days: 3
