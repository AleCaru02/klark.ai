name: Deploy MVP Supabase Functions

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact main commit SHA approved for production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-mvp-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: weufeilkdzimmmgskobs
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify exact approved commit
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "${{ inputs.expected_sha }}" ]; then
            echo "Refusing production deploy: main is $actual_sha, expected ${{ inputs.expected_sha }}"
            exit 1
          fi

      - name: Require deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "Missing OPENAI_API_KEY"; exit 1; }
          test -n "$GOOGLE_CLIENT_ID" || { echo "Missing GOOGLE_CLIENT_ID"; exit 1; }
          test -n "$GOOGLE_CLIENT_SECRET" || { echo "Missing GOOGLE_CLIENT_SECRET"; exit 1; }

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Update server-only provider secrets
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set --project-ref "$PROJECT_REF" \
            "OPENAI_API_KEY=$OPENAI_API_KEY" \
            "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" \
            "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"

      - name: Deploy Voice functions
        shell: bash
        run: |
          set -euo pipefail
          for fn in \
            twilio-make-call \
            twilio-voice-webhook \
            twilio-voice-gather \
            twilio-call-status \
            process-call-queue
          do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done

      - name: Deploy public chatbot function
        run: supabase functions deploy site-chat-message --project-ref "$PROJECT_REF"

      - name: Deploy Calendar functions
        shell: bash
        run: |
          set -euo pipefail
          for fn in \
            google-auth-start \
            google-auth-callback \
            ai-book-appointment \
            google-calendar-sync \
            calendar-watch
          do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done

      - name: List deployed functions for audit trail
        run: supabase functions list --project-ref "$PROJECT_REF"
