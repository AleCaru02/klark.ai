name: Apply CRM MultiTenant Patch

on:
  push:
    branches:
      - mvp/crm-multitenant

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp/crm-multitenant
          fetch-depth: 0
      - name: Apply CRM and isolation patch
        run: |
          set -euo pipefail
          tr -d '\r\n ' < .recovery/crm.patch.b64 | sed 's/=$//' | base64 -d | gzip -d > /tmp/crm.patch
          git apply -p1 --check /tmp/crm.patch
          git apply -p1 /tmp/crm.patch
          rm -rf .recovery
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: close CRM MVP fields and enforce tenant isolation tests'
          git push origin HEAD:mvp/crm-multitenant
