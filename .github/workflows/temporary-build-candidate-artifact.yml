name: Temporary Build Candidate Artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-build-candidate-artifact.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Build candidate with Supabase enabled
        env:
          VITE_SUPABASE_URL: https://ipazbzctivqquwndifxh.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_WVqZ-6gb2SutSOpqqFY_6w_YPUwmOp5
        run: npm run build
      - name: Verify candidate build
        shell: bash
        run: |
          set -euo pipefail
          grep -R -Fq 'ipazbzctivqquwndifxh.supabase.co' dist
          grep -Fq '/clerkai-assistant-v2.js' dist/index.html
          test -s dist/clerkai-assistant-v2.js
          ! grep -Fq '/clark-site-assistant.js' dist/index.html
          test -s dist/index.html
          tar -czf /tmp/clerkai-candidate-dist.tar.gz -C dist .
          sha256sum /tmp/clerkai-candidate-dist.tar.gz | tee /tmp/candidate.sha256
      - name: Publish verified static artifact branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/candidate-artifact-repo
          mkdir -p /tmp/candidate-artifact-repo
          cd /tmp/candidate-artifact-repo
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan candidate-deploy-artifact
          cp /tmp/clerkai-candidate-dist.tar.gz ./candidate-dist.tar.gz
          cp /tmp/candidate.sha256 ./candidate-dist.sha256
          printf 'Source commit: %s\n' "$GITHUB_SHA" > SOURCE_COMMIT.txt
          git add candidate-dist.tar.gz candidate-dist.sha256 SOURCE_COMMIT.txt
          git commit -m "deploy: candidate artifact $GITHUB_SHA"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:candidate-deploy-artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
