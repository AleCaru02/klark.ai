name: Diagnostic Supabase Secret

on:
  push:
    branches:
      - diag/supabase-secret-check
    paths:
      - '.github/workflows/diag-supabase-secret.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: weufeilkdzimmmgskobs
    steps:
      - name: Check token presence only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN=MISSING'; exit 1; }
          echo 'SUPABASE_ACCESS_TOKEN=PRESENT'

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check Supabase secret names only
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/supabase-secrets.txt"
          trap 'rm -f "$out"' EXIT
          supabase secrets list --project-ref "$PROJECT_REF" > "$out"
          for name in OPENAI_API_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET APP_URL ALLOWED_ORIGINS; do
            if grep -Fq "$name" "$out"; then
              echo "$name=PRESENT"
            else
              echo "$name=MISSING"
            fi
          done
          rm -f "$out"
          trap - EXIT

      - name: Verify project access
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/functions.txt"
          trap 'rm -f "$out"' EXIT
          supabase functions list --project-ref "$PROJECT_REF" > "$out"
          echo 'SUPABASE_PROJECT_ACCESS=OK'
          rm -f "$out"
          trap - EXIT
