name: Diagnostic Supabase Secret

on:
  push:
    branches:
      - diag/supabase-secret-check
    paths:
      - '.github/workflows/diag-supabase-secret.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: weufeilkdzimmmgskobs
    steps:
      - name: Check token presence only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN=MISSING'; exit 1; }
          echo 'SUPABASE_ACCESS_TOKEN=PRESENT'

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Edge Function read access only
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/functions.txt"
          err="$RUNNER_TEMP/functions.err"
          trap 'rm -f "$out" "$err"' EXIT
          if supabase functions list --project-ref "$PROJECT_REF" >"$out" 2>"$err"; then
            echo 'SUPABASE_FUNCTIONS_ACCESS=OK'
          else
            echo 'SUPABASE_FUNCTIONS_ACCESS=DENIED'
            if grep -Fq '403' "$err"; then echo 'SUPABASE_FUNCTIONS_HTTP=403'; fi
            exit 1
          fi
          rm -f "$out" "$err"
          trap - EXIT
