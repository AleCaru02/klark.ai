name: Diagnostic Supabase Secret

on:
  push:
    branches:
      - diag/supabase-secret-check
    paths:
      - '.github/workflows/diag-supabase-secret.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check presence only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo 'SUPABASE_ACCESS_TOKEN=PRESENT'
          else
            echo 'SUPABASE_ACCESS_TOKEN=MISSING'
            exit 1
          fi
