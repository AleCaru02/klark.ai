name: Configure Candidate Auth Fail Closed

on:
  push:
    branches:
      - migration/supabase-candidate
    paths:
      - '.github/workflows/configure-supabase-auth-candidate-temp.yml'

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ipazbzctivqquwndifxh
      SITE_URL: https://clerkai-preview-alecaru02.vercel.app
      REDIRECTS: https://clerkai-preview-alecaru02.vercel.app/**,https://www.clerkai.it/**,https://clerkai.it/**
    steps:
      - name: Verify current safe auth fields
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          cfg="$RUNNER_TEMP/auth-before.json"
          curl -fsS "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" > "$cfg"
          jq '{disable_signup,site_url,uri_allow_list,external_google_enabled,anonymous_users_enabled,password_min_length}' "$cfg"
          rm -f "$cfg"

      - name: Disable self-service signup and restrict redirects
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -cn --arg site "$SITE_URL" --arg redirects "$REDIRECTS" '{disable_signup:true,site_url:$site,uri_allow_list:$redirects}')
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" >/dev/null

      - name: Assert fail-closed auth configuration
        shell: bash
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/auth-after.json"
          curl -fsS "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" > "$cfg"
          test "$(jq -r '.disable_signup' "$cfg")" = "true"
          test "$(jq -r '.site_url' "$cfg")" = "$SITE_URL"
          test "$(jq -r '.uri_allow_list' "$cfg")" = "$REDIRECTS"
          echo "AUTH_DISABLE_SIGNUP=true"
          echo "AUTH_SITE_URL_OK=true"
          echo "AUTH_REDIRECT_ALLOWLIST_OK=true"
          echo "AUTH_GOOGLE_ENABLED=$(jq -r '.external_google_enabled // false' "$cfg")"
          rm -f "$cfg"
