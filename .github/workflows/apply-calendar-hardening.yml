name: Apply Calendar Hardening

on:
  push:
    branches:
      - mvp/calendar-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp/calendar-hardening
          fetch-depth: 0
      - name: Apply Calendar patch
        run: |
          set -euo pipefail
          base64 -d .recovery/calendar.patch.b64 | gzip -d > /tmp/calendar.patch
          git apply -p1 --check /tmp/calendar.patch
          git apply -p1 /tmp/calendar.patch
          rm -rf .recovery
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden Google Calendar OAuth and booking concurrency'
          git push origin HEAD:mvp/calendar-hardening
