name: Import Lovable Source

on:
  push:
    branches:
      - recovery/lovable-source

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          ref: recovery/lovable-source
          fetch-depth: 0

      - name: Download recovered source artifact
        env:
          ARTIFACT_URL: 'https://sdmntpreastus.oaiusercontent.com/files/00000000-0ea4-81f9-bdc2-a1f772b5efc1/raw?se=2026-08-08T14%3A09%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=c10804cb-8968-54fe-8ddb-b6547e3a446b&skoid=b32d65cd-c8f1-46fb-90df-c208671889d4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T08%3A43%3A31Z&ske=2026-08-09T08%3A43%3A31Z&sks=b&skv=2026-02-06&sig=IK9wn4Vp5wesNVW2zgIsveaPs1c8ZhE8as7uuQL74io%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/clerkai-artifact.zip
          mkdir -p /tmp/outer /tmp/source
          unzip -q /tmp/clerkai-artifact.zip -d /tmp/outer
          if [ -f /tmp/outer/clerkai-source.zip ]; then
            unzip -q /tmp/outer/clerkai-source.zip -d /tmp/source
          else
            cp -a /tmp/outer/. /tmp/source/
          fi
          test -f /tmp/source/package.json
          test -d /tmp/source/src
          test -d /tmp/source/supabase/functions
          test -d /tmp/source/supabase/migrations

      - name: Replace target with recovered source except workflows
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/source/ ./

      - name: Commit recovered source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'recovery: import Lovable source snapshot 3027dcf excluding workflows'
          git push origin HEAD:recovery/lovable-source
