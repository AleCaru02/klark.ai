name: Apply onboarding integration patch

on:
  push:
    branches:
      - agent/mvp-production-readiness-20260810
    paths:
      - .github/workflows/apply-onboarding-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp-production-readiness-20260810
      - name: Integrate structured onboarding sections
        env:
          PATCH_SCRIPT_B64: 
        run: |
          echo "$PATCH_SCRIPT_B64" | base64 --decode > /tmp/onboarding_patch.py
          python /tmp/onboarding_patch.py
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/app/Onboarding.tsx
          git commit -m "feat(onboarding): integrate production readiness sections"
          git push origin HEAD:agent/mvp-production-readiness-20260810
