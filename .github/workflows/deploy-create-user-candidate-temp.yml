name: Deploy Exact Candidate Create User

on:
  push:
    branches:
      - migration/supabase-candidate
    paths:
      - '.github/workflows/deploy-create-user-candidate-temp.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ipazbzctivqquwndifxh
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy exact repository source
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = "ipazbzctivqquwndifxh"
          supabase functions deploy create-user --project-ref "$PROJECT_REF"
