name: OpenAI Candidate Chatbot E2E20

on:
  push:
    branches:
      - diagnostic/openai-chatbot-e2e20
    paths:
      - '.github/workflows/openai-chatbot-e2e20-temp.yml'

permissions:
  contents: read

jobs:
  e2e20:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PROJECT_REF: ipazbzctivqquwndifxh
      CHAT_BASE: https://ipazbzctivqquwndifxh.supabase.co/functions/v1
      WIDGET_KEY: 21332d02-8c76-458b-9961-267db3044205
      CHAT_ORIGIN: https://clerkai-preview-alecaru02.vercel.app
      TEST_UA: ClarkAI-E2E20-20260809-R4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify required secrets are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN=MISSING"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY=MISSING"; exit 1; }
          echo "SUPABASE_ACCESS_TOKEN=PRESENT"
          echo "OPENAI_API_KEY=PRESENT"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure OpenAI runtime on candidate only
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/openai-runtime.env"
          trap 'rm -f "$f"' EXIT
          umask 077
          {
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'OPENAI_CHAT_MODEL=gpt-5.4-mini\n'
          } > "$f"
          supabase secrets set --project-ref "$PROJECT_REF" --env-file "$f" >/dev/null
          rm -f "$f"
          trap - EXIT
          echo "CANDIDATE_OPENAI_SECRET_SET=true"
          echo "CANDIDATE_OPENAI_MODEL=gpt-5.4-mini"

      - name: Verify active chatbot functions on fixed candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = "ipazbzctivqquwndifxh"
          out="$RUNNER_TEMP/functions.txt"
          supabase functions list --project-ref "$PROJECT_REF" > "$out"
          grep -q 'site-chat-bootstrap' "$out"
          grep -q 'site-chat-message' "$out"
          echo "CHATBOT_FUNCTIONS_ACTIVE=true"
          rm -f "$out"

      - name: Run 20 real server-side chatbot requests with semantic gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request
          import urllib.error

          base = os.environ['CHAT_BASE']
          key = os.environ['WIDGET_KEY']
          origin = os.environ['CHAT_ORIGIN']
          ua = os.environ['TEST_UA']

          questions = [
              "Cosa fa ClerkAI?",
              "Quanto costa?",
              "Posso usare il mio numero?",
              "Ho un cellulare 3331234567, devo cambiarlo?",
              "Ho già un numero 02, posso mantenerlo?",
              "Posso fare chiamate mentre ClerkAI chiama?",
              "Come funziona la deviazione se non rispondo?",
              "Funziona se sono occupato?",
              "Può gestire le chiamate fuori orario?",
              "Uso WhatsApp Business, posso continuare a usare l'app?",
              "Cos'è Coexistence?",
              "Può scrivere automaticamente a tutti i miei contatti?",
              "Faccio Facebook Ads: può chiamare i lead?",
              "Può chiamare lead che non hanno chiesto di essere ricontattati?",
              "Sono parrucchiere, cosa può fare ClerkAI per me?",
              "Sono un property manager, cosa può fare ClerkAI per me?",
              "Può prenotare appuntamenti su Google Calendar?",
              "Registra le chiamate?",
              "Come gestite privacy, consenso e opt-out?",
              "Se il cliente vuole parlare con una persona, come funziona il passaggio a un umano?",
          ]

          def post(url, payload):
              body = json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(url, data=body, method='POST', headers={
                  'Content-Type': 'application/json', 'Origin': origin, 'User-Agent': ua,
              })
              try:
                  with urllib.request.urlopen(req, timeout=90) as resp:
                      return resp.status, json.loads(resp.read().decode('utf-8'))
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode('utf-8', errors='replace')
                  try: data = json.loads(raw)
                  except Exception: data = {'raw': raw[:1000]}
                  return exc.code, data

          def phase_not_active(text):
              t = text.lower()
              return ('non attiv' in t or 'non è attiv' in t or 'non e attiv' in t or
                      'fuori dalla fase 1' in t or 'non fa parte della fase 1' in t)

          def semantic_ok(idx, answer):
              t = answer.lower()
              if idx in (1, 15) and 'whatsapp' in t and not phase_not_active(t):
                  return False, 'WhatsApp presented without Fase 1 inactive qualifier'
              if idx == 10:
                  return (phase_not_active(t) and 'continu' in t), 'WhatsApp Business must be independent and inactive in Fase 1'
              if idx == 11:
                  return (phase_not_active(t) and 'coexistence' in t), 'Coexistence must be explicitly inactive in Fase 1'
              if idx == 12:
                  return (t.startswith('no') or 'non può' in t or 'non puo' in t or 'non deve' in t), 'Bulk automatic contact messaging must not be allowed'
              if idx == 13:
                  return (('meta' in t or 'facebook' in t) and phase_not_active(t)), 'Meta Lead Ads automation must be explicitly inactive in Fase 1'
              if idx == 14:
                  return (('non' in t) and ('permess' in t or 'consens' in t or 'ricontatt' in t)), 'Outbound lead call requires permission/callback rule'
              if idx == 17:
                  return ('google calendar' in t and ('verific' in t or 'oauth' in t or 'colleg' in t)), 'Calendar must be conditional on verified connection'
              if idx == 18:
                  return ('opt-in' in t or 'solo se' in t), 'Recording must be opt-in only'
              if idx == 19:
                  return (('consens' in t or 'base giurid' in t) and ('opt-out' in t or 'do_not_contact' in t or 'stop' in t)), 'Privacy answer must cover consent and opt-out'
              if idx == 20:
                  has_callback = ('ricontatt' in t or 'escalation' in t)
                  live_claim = ('trasferisce la chiamata' in t or 'trasferimento live' in t) and 'non' not in t
                  return (has_callback and not live_claim), 'Handoff must be callback/escalation, not unverified live transfer'
              return True, ''

          sessions = []
          bootstrap_url = f"{base}/site-chat-bootstrap?key={key}"
          for i in range(4):
              status, data = post(bootstrap_url, {})
              if status != 201 or not data.get('session_id') or not data.get('session_token'):
                  print(f"BOOTSTRAP_{i+1}=FAIL HTTP={status}")
                  sys.exit(1)
              sessions.append((data['session_id'], data['session_token']))
              print(f"BOOTSTRAP_{i+1}=PASS SESSION_ID={data['session_id']}")

          message_url = f"{base}/site-chat-message?key={key}"
          failures = []
          fallback_fragments = ["In questo momento il servizio AI non è disponibile", "Chat service temporarily unavailable"]

          for idx, question in enumerate(questions, start=1):
              session_id, session_token = sessions[(idx - 1) // 5]
              status, data = post(message_url, {
                  'session_id': session_id, 'session_token': session_token,
                  'message': question, 'consent': True, 'action': 'message',
              })
              answer = str(data.get('answer') or '')
              provider = data.get('provider_status')
              sources = data.get('sources') or []
              bad_fallback = any(fragment.lower() in answer.lower() for fragment in fallback_fragments)
              sem_ok, sem_reason = semantic_ok(idx, answer)
              ok = status == 200 and provider == 'ok' and len(answer.strip()) >= 20 and len(sources) > 0 and not bad_fallback and sem_ok
              print(f"Q{idx:02d}={'PASS' if ok else 'FAIL'} HTTP={status} PROVIDER={provider} ANSWER_LEN={len(answer)} SOURCES={len(sources)} SEMANTIC={sem_ok}")
              if not ok:
                  failures.append((idx, status, provider, sem_reason, answer[:700]))
              time.sleep(0.75)

          print('E2E_REQUESTS=20')
          print(f"E2E_PASS={20-len(failures)}")
          print(f"E2E_FAIL={len(failures)}")
          if failures:
              for idx, status, provider, reason, snippet in failures:
                  print(f"FAIL_DETAIL_Q{idx:02d} HTTP={status} PROVIDER={provider} REASON={reason} ANSWER={json.dumps(snippet, ensure_ascii=False)}")
              sys.exit(1)
          print('OPENAI_CHATBOT_E2E20_SEMANTIC=PASS')
          PY
