name: Apply MVP Tenant Lifecycle

on:
  push:
    branches:
      - mvp/tenant-lifecycle

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp/tenant-lifecycle
          fetch-depth: 0
      - name: Apply prepared lifecycle patch
        env:
          PATCH_GZ_B64: '[... ELLIPSIZATION ...]' 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/mvp.patch
          git apply --check /tmp/mvp.patch
          git apply /tmp/mvp.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add internal tenant lifecycle for manual-billing MVP'
          git push origin HEAD:mvp/tenant-lifecycle
