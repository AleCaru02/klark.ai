name: Migrate Supabase Candidate

on:
  push:
    branches:
      - migration/supabase-candidate
    paths:
      - '.github/workflows/migrate-supabase-candidate.yml'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ipazbzctivqquwndifxh
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify target project access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase functions list --project-ref "$PROJECT_REF" >/dev/null
      - name: Link candidate project without stored DB password
        shell: bash
        run: |
          set -euo pipefail
          printf '\n' | supabase link --project-ref "$PROJECT_REF"
      - name: Preview all migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --dry-run --linked --include-all
      - name: Apply all GitHub migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --include-all --yes
      - name: Verify migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked
      - name: Confirm clean replay state
        run: echo 'Candidate migration history revalidated'
