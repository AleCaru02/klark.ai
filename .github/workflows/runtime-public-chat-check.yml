name: Runtime Public Chat Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-public-chat-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Test public chatbot backend
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://weufeilkdzimmmgskobs.supabase.co/functions/v1'
          KEY='21332d02-8c76-458b-9961-267db3044205'
          ORIGIN='https://clerkai-preview-alecaru02.vercel.app'
          MARKER='RUNTIME_DIAGNOSTIC_20260808_2250'

          boot_file="$RUNNER_TEMP/boot.json"
          chat_file="$RUNNER_TEMP/chat.json"

          boot_status=$(curl -sS -o "$boot_file" -w '%{http_code}' -X POST \
            "$BASE/site-chat-bootstrap?key=$KEY" \
            -H 'Content-Type: application/json' \
            -H 'x-clark-widget: public-site' \
            -H "Origin: $ORIGIN" \
            --data '{}')
          echo "BOOTSTRAP_HTTP=$boot_status"

          session_id=$(jq -r '.session_id // empty' "$boot_file")
          session_token=$(jq -r '.session_token // empty' "$boot_file")
          if [ -z "$session_id" ] || [ -z "$session_token" ]; then
            echo 'BOOTSTRAP_SESSION=false'
            exit 0
          fi
          echo 'BOOTSTRAP_SESSION=true'

          payload=$(jq -cn \
            --arg sid "$session_id" \
            --arg token "$session_token" \
            --arg message "$MARKER Quanto costa ClerkAI?" \
            '{session_id:$sid,session_token:$token,message:$message}')

          chat_status=$(curl -sS -o "$chat_file" -w '%{http_code}' -X POST \
            "$BASE/site-chat-message?key=$KEY" \
            -H 'Content-Type: application/json' \
            -H 'x-clark-widget: public-site' \
            -H "Origin: $ORIGIN" \
            --data "$payload")
          echo "CHAT_HTTP=$chat_status"
          has_answer=$(jq -r 'if ((.answer // "") | length) > 0 then "true" else "false" end' "$chat_file" 2>/dev/null || echo false)
          echo "HAS_ANSWER=$has_answer"
          error_code=$(jq -r '.error // .code // empty' "$chat_file" 2>/dev/null || true)
          if [ -n "$error_code" ]; then echo "ERROR_PRESENT=true"; else echo "ERROR_PRESENT=false"; fi

          rm -f "$boot_file" "$chat_file"
