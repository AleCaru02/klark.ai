name: Diagnose Google OAuth Readiness

on:
  push:
    branches:
      - diagnostic/google-oauth-readiness
    paths:
      - '.github/workflows/diag-google-oauth-readiness-temp.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      PROJECT_REF: ipazbzctivqquwndifxh
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check GitHub Actions secret presence only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" && echo 'GITHUB_SUPABASE_ACCESS_TOKEN=PRESENT' || echo 'GITHUB_SUPABASE_ACCESS_TOKEN=MISSING'
          test -n "$GOOGLE_CLIENT_ID" && echo 'GITHUB_GOOGLE_CLIENT_ID=PRESENT' || echo 'GITHUB_GOOGLE_CLIENT_ID=MISSING'
          test -n "$GOOGLE_CLIENT_SECRET" && echo 'GITHUB_GOOGLE_CLIENT_SECRET=PRESENT' || echo 'GITHUB_GOOGLE_CLIENT_SECRET=MISSING'

      - name: Check candidate Edge Function secret names only
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/secrets.txt"
          supabase secrets list --project-ref "$PROJECT_REF" > "$out"
          grep -q 'GOOGLE_CLIENT_ID' "$out" && echo 'SUPABASE_GOOGLE_CLIENT_ID=PRESENT' || echo 'SUPABASE_GOOGLE_CLIENT_ID=MISSING'
          grep -q 'GOOGLE_CLIENT_SECRET' "$out" && echo 'SUPABASE_GOOGLE_CLIENT_SECRET=PRESENT' || echo 'SUPABASE_GOOGLE_CLIENT_SECRET=MISSING'
          grep -q 'APP_URL' "$out" && echo 'SUPABASE_APP_URL=PRESENT' || echo 'SUPABASE_APP_URL=MISSING'
          grep -q 'ALLOWED_ORIGINS' "$out" && echo 'SUPABASE_ALLOWED_ORIGINS=PRESENT' || echo 'SUPABASE_ALLOWED_ORIGINS=MISSING'
          rm -f "$out"

      - name: Read non-secret Auth URL configuration
        shell: bash
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/auth.json"
          curl -fsS "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" > "$cfg"
          echo "SUPABASE_SITE_URL=$(jq -r '.site_url // ""' "$cfg")"
          echo "SUPABASE_URI_ALLOW_LIST=$(jq -r '.uri_allow_list // ""' "$cfg")"
          echo "SUPABASE_SIGNUP_DISABLED=$(jq -r '.disable_signup // false' "$cfg")"
          rm -f "$cfg"

      - name: Confirm Calendar Edge Functions exist
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/functions.txt"
          supabase functions list --project-ref "$PROJECT_REF" > "$out"
          for fn in google-auth-start google-auth-callback ai-book-appointment google-calendar-sync calendar-watch; do
            grep -q "$fn" "$out" && echo "FUNCTION_${fn}=PRESENT" || { echo "FUNCTION_${fn}=MISSING"; exit 1; }
          done
          rm -f "$out"
