# Endpoint provider e callback OAuth: il gateway non può richiedere un JWT
# Supabase perché i provider esterni non ne possiedono uno. Questi endpoint
# applicano firme crittografiche, token di verifica o state OAuth monouso.
[functions.stripe-webhook]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

[functions.meta-leadads-webhook]
verify_jwt = false

[functions.facebook-webhook-tenant]
verify_jwt = false

[functions.twilio-call-status]
verify_jwt = false

[functions.twilio-voice-webhook]
verify_jwt = false

[functions.twilio-voice-gather]
verify_jwt = false

[functions.calendar-watch]
verify_jwt = false

[functions.google-auth-callback]
