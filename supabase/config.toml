[functions.meta-leadads-auth-callback]
verify_jwt = false

[functions.whatsapp-auth-callback]
verify_jwt = false

# Sync Calendar viene invocato sia da utenti autenticati sia dal webhook
# calendar-watch tramite service-role. Il gateway resta aperto, mentre la
# funzione applica internamente la verifica JWT utente/service-role e il
# controllo tenant prima di eseguire qualunque sincronizzazione.
[functions.google-calendar-sync]
verify_jwt = false

# Demo pubblica: accetta soltanto clip predefinite, limita le origini e
# restituisce audio cacheato in Storage. Nessun testo arbitrario.
[functions.public-voice-demo]
verify_jwt = false

# Richiesta demo pubblica: validazione server-side, allowlist origin,
# honeypot, rate limit e scrittura service-role su tabella RLS isolata.
[functions.public-demo-request]
verify_jwt = false

# Widget pubblico: nessun JWT Supabase viene esposto al sito del cliente.
# Chiave widget revocabile, allowlist origin, sessione firmata e rate limiting
# vengono verificati dentro le funzioni.
[functions.site-chat-bootstrap]
verify_jwt = false

[functions.site-chat-message]
verify_jwt = false

# Bootstrap usa un segreto costante, confronto constant-time e controllo
# monouso della piattaforma. Va disabilitato o ruotato dopo il bootstrap.
[functions.bootstrap-admin]
verify_jwt = false

