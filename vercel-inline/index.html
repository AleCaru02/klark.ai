    <script>
      (function () {
        var FAIL =
          'Browser non supportato: questa pagina richiede un browser moderno con supporto a DecompressionStream (Chrome/Edge 80+, Safari 16.4+, Firefox 113+). Aggiorna il browser e riprova.';
        function showError(msg) {
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:40rem;margin:15vh auto;padding:1.5rem;line-height:1.6;color:#18181b">' +
            '<h1 style="font-size:1.25rem;margin:0 0 .75rem">ClerkAI non pu\u00f2 essere caricato</h1>' +
            '<p style="margin:0">' + msg + '</p></div>';
        }
        if (typeof DecompressionStream === 'undefined' || typeof Blob === 'undefined') {
          showError(FAIL);
          return;
        }
        function gunzip(b64) {
          var bin = atob(b64);
          var bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
          return new Response(stream).arrayBuffer();
        }
        function raw(id) {
          return document.getElementById(id).textContent.replace(/\s+/g, '');
        }
        gunzip(raw('app-css-gz'))
          .then(function (buf) {
            var style = document.createElement('style');
            style.textContent = new TextDecoder().decode(buf);
            document.head.appendChild(style);
            return gunzip(raw('app-js-gz'));
          })
          .then(function (buf) {
            var url = URL.createObjectURL(new Blob([buf], { type: 'text/javascript' }));
            return import(/* @vite-ignore */ url);
          })
          .catch(function (err) {
            console.error(err);
            showError('Errore durante il caricamento dell\'applicazione: ' + (err && err.message ? err.message : err));
          });
      })();
    </script>
